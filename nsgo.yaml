name: nsgo-pet
id: dev.nsgo.pet
version: 0.1.0

# macOS uses assets/AppIcon.icon or assets/AppIcon.icns; Linux, and macOS
# without those, use assets/Icon.png. Name them here:
# icon:
#   apple: assets/AppIcon.icon  # an Icon Composer .icon, or an .icns
#   png: assets/Icon.png        # a square PNG, 1024 pixels wide
# nsgo dev uses the same names ending in -dev where they exist, or the files
# dev.icon names.
icon:
  apple: assets/AppIcon.icon
  png: assets/Icon.png

# Updates: key is the public key nsgo keygen printed; its secret key never
# goes in the repository, but in NSGO_UPDATES_KEY where releases build, the
# repository's secret of that name in GitHub Actions.
updates:
  key: 8+lMn9ixDn7sbqoWxwRKQDGiZ6wwtfjRXos/4GQNURk=

dev:
  # native: this machine's backend. The pet is desktop only: no web, iOS or Android.
  target: native
  # true, the default, rebuilds and restarts on save; false runs once and exits with the app.
  hot_reload: true

build:
  output: dist
  # true opens the output directory after building.
  open: true
  # Desktop only, the targets the release publishes; Windows waits until the pet plays there (see the README).
  targets: [macos_arm64, macos_x64, linux_x64, linux_arm64]

# The repository whose latest release holds the appcasts installed pets read.
release:
  github: nsgo-dev/nsgo-pet

# The WebM clips have alpha, which GStreamer decodes with codecalpha from its bad plugins.
linux:
  depends:
    deb: [gstreamer1.0-plugins-bad]
    arch: [gst-plugins-bad]
