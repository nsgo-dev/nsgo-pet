name: Release

# Builds the pet's installers with nsgo build (go tool nsgo, the version go.mod pins) and publishes them on the GitHub release of the tag: the macOS disk images on a macOS runner, signed with YLDM's Developer ID and notarized so Gatekeeper opens them without a warning, and the Linux packages and AppImages on Ubuntu, with nsgo build's install scripts. Windows is left out until the pet runs there (see the README).
#
# Push a tag v<version>, matching version in nsgo.yaml, to release. A pull request that changes this file, or a run by hand (Actions › Release › Run workflow), builds and signs the same packages without publishing them, keeping them as the run's artifacts.
#
# Signing takes the organization's secrets: MACOS_CERTIFICATE, the Developer ID Application certificate and its key as a base64 PKCS#12, MACOS_CERTIFICATE_PASSWORD, and the App Store Connect API key that notarizes, APPSTORE_API_KEY_P8 (base64), APPSTORE_API_KEY_ID and APPSTORE_API_ISSUER_ID, which nsgo build reads as NSGO_NOTARY_KEY, NSGO_NOTARY_KEY_ID and NSGO_NOTARY_ISSUER. The identity is the organization's MACOS_SIGNING_IDENTITY variable. A pull request from a fork gets no secrets, so its macOS packages are signed ad hoc.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Notarizing the two disk images can take Apple's service a while.
    timeout-minutes: ${{ matrix.name == 'macOS' && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # installers: what each target must make, after nsgo-pet-<version>-<target>, so that a package nsgo build leaves out fails the row rather than going missing from the release. scripts: install.sh and install.ps1, kept from one row.
          - { name: macOS, os: macos-latest, targets: "macos_arm64,macos_x64", installers: ".dmg" }
          - { name: Linux, os: ubuntu-latest, targets: "linux_x64,linux_arm64", installers: ".deb .pkg.tar.gz .AppImage", scripts: true }
    env:
      MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A tag that does not match the version in nsgo.yaml would publish packages named for another version.
      - name: Check the version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -nE 's/^version: *"?([0-9.]+)"? *$/\1/p' nsgo.yaml)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG does not match version $version in nsgo.yaml."
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The certificate goes into a keychain of the job's own, which codesign finds on the user's keychain list; the notary key is written to a file nsgo build reads, deleted with the keychain at the end of the job, and the certificate's file is deleted at once. A tag requires the secrets; elsewhere a run without them, such as a fork's pull request, builds ad hoc.
      - name: Import the signing certificate and the notary key
        id: signing
        if: matrix.name == 'macOS'
        env:
          TAGGED: ${{ startsWith(github.ref, 'refs/tags/') }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          for name in MACOS_SIGNING_IDENTITY MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD APPSTORE_API_KEY_P8 APPSTORE_API_KEY_ID APPSTORE_API_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              if [ "$TAGGED" = true ]; then
                echo "::error::$name is not set, so the macOS packages cannot be signed and notarized."
                exit 1
              fi
              echo "::warning::$name is not set; the macOS packages are signed ad hoc."
              exit 0
            fi
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # one argument per keychain path
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | xargs)
          if ! security find-identity -v -p codesigning "$keychain" | grep -qF "\"$MACOS_SIGNING_IDENTITY\""; then
            echo "::error::MACOS_CERTIFICATE does not hold $MACOS_SIGNING_IDENTITY."
            exit 1
          fi
          key="$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$APPSTORE_API_KEY_P8" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "notary-key=$key" >> "$GITHUB_OUTPUT"
      # A signed build passes the Developer ID to -sign and the notary key in NSGO_NOTARY_KEY*, so nsgo build signs with the hardened runtime, notarizes the disk images and staples their tickets.
      - name: Build
        env:
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          NOTARY_KEY: ${{ steps.signing.outputs.notary-key }}
          NOTARY_KEY_ID: ${{ steps.signing.outputs.notary-key != '' && secrets.APPSTORE_API_KEY_ID || '' }}
          NOTARY_ISSUER: ${{ steps.signing.outputs.notary-key != '' && secrets.APPSTORE_API_ISSUER_ID || '' }}
          TARGETS: ${{ matrix.targets }}
        run: |
          sign=()
          if [ -n "$KEYCHAIN" ]; then
            sign=(-sign "$MACOS_SIGNING_IDENTITY")
            export NSGO_NOTARY_KEY=$NOTARY_KEY NSGO_NOTARY_KEY_ID=$NOTARY_KEY_ID NSGO_NOTARY_ISSUER=$NOTARY_ISSUER
          fi
          go tool nsgo build -target "$TARGETS" -output "$RUNNER_TEMP/packages" "${sign[@]}" .
      # Gatekeeper's own check of what users download: the app is signed with the Developer ID and the hardened runtime, and each disk image carries its notarization ticket.
      - name: Check the signatures
        if: steps.signing.outputs.keychain != ''
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          shopt -s nullglob
          for target in ${TARGETS//,/ }; do
            apps=("$RUNNER_TEMP"/packages/*-"$target"/*.app)
            if [ "${#apps[@]}" -ne 1 ]; then
              echo "::error::nsgo build made ${#apps[@]} apps for $target, not one"
              exit 1
            fi
            codesign --verify --deep --strict --verbose=2 "${apps[0]}"
            codesign -dvv "${apps[0]}" 2>&1 | grep -F "Authority=$MACOS_SIGNING_IDENTITY"
            dmgs=("$RUNNER_TEMP"/packages/releases/*-"${target/_/-}".dmg)
            if [ "${#dmgs[@]}" -ne 1 ]; then
              echo "::error::nsgo build made ${#dmgs[@]} disk images for $target, not one"
              exit 1
            fi
            xcrun stapler validate "${dmgs[0]}"
            spctl --assess --type open --context context:primary-signature --verbose=2 "${dmgs[0]}"
          done
      # The files of nsgo build's releases folder: each target's installers with their .sha256, and from the Linux row the install scripts. Every installer the row's targets should make must be there, once.
      - name: Collect the packages
        env:
          TARGETS: ${{ matrix.targets }}
          INSTALLERS: ${{ matrix.installers }}
          SCRIPTS: ${{ matrix.scripts && 'true' || '' }}
        run: |
          cd "$RUNNER_TEMP/packages/releases"
          shopt -s nullglob
          read -ra suffixes <<<"$INSTALLERS"
          for target in ${TARGETS//,/ }; do
            for suffix in "${suffixes[@]}"; do
              found=(*-"${target/_/-}$suffix")
              if [ "${#found[@]}" -ne 1 ] || [ ! -f "${found[0]}.sha256" ]; then
                echo "::error::nsgo build made ${#found[@]} files matching *-${target/_/-}$suffix, not one with its .sha256"
                exit 1
              fi
            done
          done
          if [ -n "$SCRIPTS" ] && { [ ! -f install.sh ] || [ ! -f install.ps1 ]; }; then
            echo "::error::nsgo build made no install.sh or install.ps1"
            exit 1
          fi
          out=$RUNNER_TEMP/out
          mkdir "$out"
          for file in *; do
            [ -f "$file" ] || continue
            case $file in
              install.sh | install.ps1) [ -n "$SCRIPTS" ] || continue ;;
            esac
            cp -- "$file" "$out/"
          done
          ls -l "$out"
      - name: Keep the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nsgo-pet-${{ matrix.name }}
          path: ${{ runner.temp }}/out/
          retention-days: 7
          if-no-files-found: error
      - name: Remove the signing keychain and the notary key
        if: always() && steps.signing.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          NOTARY_KEY: ${{ steps.signing.outputs.notary-key }}
        run: |
          rm -f "$NOTARY_KEY"
          security delete-keychain "$KEYCHAIN"

  # A job of its own holds the token that writes the release, so nsgo build and the tools it runs never see it.
  publish:
    name: Publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nsgo-pet-*
          path: packages
          merge-multiple: true
      - name: Check the checksums
        working-directory: packages
        run: |
          for sum in *.sha256; do
            expected=$(cut -d' ' -f1 "$sum")
            actual=$(sha256sum "${sum%.sha256}" | cut -d' ' -f1)
            if [ "$expected" != "$actual" ]; then
              echo "::error::${sum%.sha256} does not match its .sha256"
              exit 1
            fi
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag --generate-notes
